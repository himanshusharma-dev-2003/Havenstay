name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Server Tests ────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          CI: true
          # Minimal secrets for JWT signing in auth middleware tests.
          # These are non-sensitive test-only values — real secrets are
          # stored in the deployment environment, not here.
          JWT_ACCESS_SECRET: ci-test-access-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-used-in-production
          # REDIS_URL intentionally omitted — cache service falls back
          # gracefully and all tests mock the cache layer anyway.
          # MONGO_URI intentionally omitted — concurrency test uses
          # mongodb-memory-server (in-process, no external connection).

  # ── Client Build Verification ───────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000/api
