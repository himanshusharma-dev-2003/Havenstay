version: '3.8'

# ── HavenStay local development stack ────────────────────────────
# Services: MongoDB + API server
# Usage:
#   docker-compose up          → start all services
#   docker-compose up --build  → rebuild API image first
#   docker-compose down -v     → stop and remove volumes

services:
  mongo:
    image: mongo:6-jammy
    container_name: havenstay-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: havenstay-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/havenstay
      - NODE_ENV=production
      - PORT=5000
      # Secrets — override these via a .env file or CI/CD secrets manager
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_me_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_in_production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - '5000:5000'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mongo-data:
    name: havenstay-mongo-data
