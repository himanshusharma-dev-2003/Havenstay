version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/restrip
      - NODE_ENV=production
      - PORT=5000
    ports:
      - 5000:5000
    healthcheck:
      test: ["CMD", "node", "-e", "require('./server/server').listening ? process.exit(0) : process.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  mongo-data:
